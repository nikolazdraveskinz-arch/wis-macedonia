<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — NWIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="../assets/wis.css?v=20261019p3">
</head>
<body data-base="../" data-active="login" data-portal="public" data-scope="national">
<header id="pub-header"></header>
<main class="pub-wrap">

<div style="max-width:440px;margin:20px auto;">
<div class="card"><div class="card-body" style="display:grid;gap:12px;">
  <h1 style="font-size:20px;font-weight:800;color:#0d4a5e;margin:0;">Sign in</h1>
  <p style="font-size:12.5px;color:#64748b;margin:0;">One sign-in for registered public users and institutional staff. What you see after signing in depends on your role.</p>
  <div><label class="form-label">E-mail</label><input class="form-input" type="email" placeholder="name@example.org"></div>
  <div><label class="form-label">Password</label><input class="form-input" type="password"></div>
  <button class="btn btn-primary" style="justify-content:center;padding:10px;" onclick="WIS.signIn(new URLSearchParams(location.search).get('next')||'../participate/')"><i class="fas fa-sign-in-alt"></i>Sign in</button>
  <button class="btn btn-secondary" style="justify-content:center;padding:10px;" onclick="wisToast('Redirect to the national eID service (mockup)')"><i class="fas fa-id-card"></i>Sign in with national eID</button>
  <div style="font-size:12px;color:#64748b;text-align:center;">No account? <a href="../register/" style="color:#1a6b82;font-weight:600;">Register</a> · <a href="#" style="color:#1a6b82;">Forgot password</a></div>
  <div style="border-top:1px solid #f1f5f9;padding-top:10px;">
    <div class="form-label">Mockup shortcuts</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <a class="btn btn-secondary btn-sm" href="../app/" onclick="try{localStorage.setItem('wis.role','superadmin')}catch(e){}">Internal portal (Super admin)</a>
      <a class="btn btn-secondary btn-sm" href="../app/" onclick="try{localStorage.setItem('wis.role','technical')}catch(e){}">Technical user</a>
      <a class="btn btn-secondary btn-sm" href="#" onclick="WIS.signIn('../participate/');return false;">Registered external user</a>
    </div>
  </div>
</div></div></div>

</main>
<footer id="pub-footer"></footer>
<script src="../assets/shell.js?v=20261019p3"></script>

</body>
</html>
