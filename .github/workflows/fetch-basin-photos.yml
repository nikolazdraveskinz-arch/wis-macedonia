name: Fetch basin photos (one-off)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-basin-photos.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Download photos from Wikimedia Commons
        run: |
          cat > /tmp/fetch.mjs <<'EOF'
          import fs from 'node:fs';
          const UA = { 'User-Agent': 'NWIS-mockup/1.0 (https://github.com/nikolazdraveskinz-arch/wis-macedonia)' };
          const PHOTO = {
            VAR: ['Vardar', 'Veles,_North_Macedonia', 'Matka_Canyon'],
            BDR: ['Lake_Ohrid', 'Black_Drin', 'Struga'],
            STR: ['Strumica_(river)', 'Kolešino_Falls', 'Strumica'],
            JMO: ['Binačka_Morava', 'Lipkovo_Lake', 'Kumanovo']
          };
          const isPhoto = u => !!u && /\.(jpe?g|png|webp)$/i.test(u.split('?')[0]) && !/(map|karte|locator|location|relief|flag|coat_of|grb|\.svg)/i.test(u);
          const strip = h => (h || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
          const dir = 'v2/assets/img/basins';
          fs.mkdirSync(dir, { recursive: true });
          const credits = {};
          for (const [id, titles] of Object.entries(PHOTO)) {
            for (const t of titles) {
              try {
                const sm = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t), { headers: UA }).then(r => r.ok ? r.json() : null);
                const src = sm && (sm.originalimage || sm.thumbnail) && (sm.originalimage || sm.thumbnail).source;
                if (!isPhoto(src)) continue;
                const file = decodeURIComponent(src.split('/').pop().replace(/^\d+px-/, ''));
                const meta = await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=900&titles=File:' + encodeURIComponent(file), { headers: UA }).then(r => r.json());
                const page = Object.values(meta.query.pages)[0], ii = page.imageinfo && page.imageinfo[0];
                if (!ii) continue;
                const url = ii.thumburl || ii.url;
                const res = await fetch(url, { headers: UA });
                if (!res.ok) continue;
                const ext = (url.split('?')[0].match(/\.(jpe?g|png|webp)$/i) || ['', 'jpg'])[1].toLowerCase().replace('jpeg', 'jpg');
                const name = `${id.toLowerCase()}.${ext}`;
                fs.writeFileSync(`${dir}/${name}`, Buffer.from(await res.arrayBuffer()));
                const m = ii.extmetadata || {};
                credits[id] = {
                  src: name,
                  article: sm.title,
                  file,
                  page: ii.descriptionurl,
                  artist: strip(m.Artist && m.Artist.value) || 'Wikimedia Commons',
                  licence: strip(m.LicenseShortName && m.LicenseShortName.value),
                  licenceUrl: strip(m.LicenseUrl && m.LicenseUrl.value),
                  description: strip(m.ImageDescription && m.ImageDescription.value).slice(0, 160)
                };
                console.log(id, '->', file, url);
                break;
              } catch (e) { console.warn(id, t, e.message); }
            }
            if (!credits[id]) console.warn('NO PHOTO for', id);
          }
          fs.writeFileSync(`${dir}/credits.json`, JSON.stringify(credits, null, 2) + '\n');
          EOF
          node /tmp/fetch.mjs
          ls -la v2/assets/img/basins
      - name: Commit photos and remove this one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/fetch-basin-photos.yml
          git add v2/assets/img/basins
          git commit -m "Add basin photos from Wikimedia Commons (with credits); remove one-off workflow"
          git push
