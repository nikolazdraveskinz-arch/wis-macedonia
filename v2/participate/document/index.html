<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBMP document — NWIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="../../assets/wis.css?v=20261019k">
</head>
<body data-base="../../" data-active="documents" data-portal="public" data-scope="basin">
<header id="pub-header"></header>
<main class="pub-wrap">

<div class="rj-crumb"><a href="../">Have your say</a> › <span id="crumb"></span></div>
<section class="rj-source rj-head"><div class="rj-head-grid" id="dhead"></div><div id="rj-strip"></div></section>
<div class="pub-grid-1" style="display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start;">
  <div class="card" style="position:sticky;top:16px;"><div class="card-header"><h3 class="card-title">Contents</h3></div><div class="card-body" id="toc" style="font-size:12.5px;padding:12px 16px;"></div></div>
  <div><div id="secs" style="margin-top:-14px;"></div></div>
</div>

</main>
<footer id="pub-footer"></footer>
<script src="../../assets/shell.js?v=20261019k"></script>
<script src="../../assets/participation.js?v=20261019k"></script>
<script>
(function(){
const k = new URLSearchParams(location.search).get('d')||'RBMP', d = WIS.DOCS[k]||WIS.DOCS.RBMP;
if (!d) { document.querySelector('main').innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-file-alt"></i><div><b>No documents published yet for '+WIS.RBD.label+' · '+WIS.cycle.label+'.</b><br><a href="../" style="color:#1a6b82;">Back to Have your say</a></div></div></div>'; return; }
const st = WIS.STAGES.find(s=>s.n===d.stage);
document.getElementById('crumb').innerHTML = `<a href="../stage/?s=${d.stage}">Phase ${d.stage} · ${st.title}</a> › ${d.id}`;
document.getElementById('dhead').innerHTML = `<div>
  <div class="rj-eyebrow">Phase ${d.stage} · ${st.title} · document</div>
  <h1 class="rj-h1">${d.title}</h1>
  <div class="meta-row" style="margin-top:12px;"><span><b>Permanent ID:</b> <span class="id-pill">${d.id}</span></span><span><b>Version:</b> ${d.ver}</span><span><b>Published:</b> ${WIS.fmt(d.date)}</span><span><b>Language:</b> English (MK, SQ planned)</span><span><b>Permanent link:</b> <span class="id-pill">wis.moepp.gov.mk/doc/${d.id}/${d.ver.split(' ')[0]}</span></span></div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;"><button class="btn btn-secondary btn-sm" onclick="wisToast('PDF downloaded (mockup)')"><i class="fas fa-file-pdf"></i>Download PDF</button><button class="btn btn-secondary btn-sm" onclick="wisToast('Earlier versions: none (mockup)')"><i class="fas fa-history"></i>Versions</button></div>
 </div>
 <div class="card rj-here-card"><div class="card-body">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><div class="rj-eyebrow" style="color:#2a8fa8;">You are here</div><span class="badge ${st.state==='Open'?'qa-accepted':'badge-inactive'}">${st.state}</span></div>
  <div class="rj-here-t">Phase ${d.stage} · ${st.title}</div>
  <div style="font-size:12.5px;color:#4a6b75;">${st.state==='Open'?`Open for comments until ${WIS.fmt(st.closes)} · ${st.daysLeft} days left`:`Comments ${st.state.toLowerCase()}`}</div>
  <div style="font-size:12.5px;color:#4a6b75;margin-top:6px;">${d.pages} pages · ${d.sections.length} chapters, each can be commented on separately</div>
  <a href="../stage/?s=${d.stage}" class="btn btn-secondary btn-sm" style="margin-top:12px;">Back to the phase</a>
 </div></div>`;
WIS.riverStrip('rj-strip', { here: d.stage });
document.getElementById('toc').innerHTML = d.sections.map(s=>`<a href="#s${s[0]}" style="display:block;color:#334155;padding:4px 0;text-decoration:none;">§${s[0]} ${s[1]}</a>`).join('');
function render(){document.getElementById('secs').innerHTML = d.sections.map(s=>{const n=WIS.comments().filter(c=>c.target.kind==='chapter'&&c.target.doc===k&&c.target.sec===s[0]).length;
 return `<div class="card" id="s${s[0]}" style="margin-top:14px;scroll-margin-top:16px;"><div class="card-header"><h3 class="card-title">§${s[0]} ${s[1]}</h3>
 <div style="display:flex;gap:6px;align-items:center;"><span style="font-size:11px;color:#64748b;"><i class="fas fa-comment"></i> ${n}</span>${st.state==='Open'?`<button class="btn btn-primary btn-sm" onclick='WIS.openComment({"kind":"chapter","doc":"${k}","sec":"${s[0]}"},${d.stage})'><i class="fas fa-comment-dots"></i>Comment on this section</button>`:''}</div></div>
 <div class="card-body" style="font-size:13px;color:#475569;line-height:1.65;"><p style="margin:0;">Placeholder text of section ${s[0]}. In the live system the published text of the chapter appears here, with tables and maps, and each chapter has its own anchor (<span class="id-pill">#s${s[0]}</span>) so that comments, the public log and WISE references point to the exact section.</p></div></div>`;}).join('');
 if(location.hash){const el=document.querySelector(location.hash); if(el) el.scrollIntoView();}}
render(); window.onCommentAdded = render;
})();
</script>
</body>
</html>
